name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the job only reads the repo (audit — the token was read-only only
# because of the repo's default setting).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (third-party tags are mutable); no token left in .git for later steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun test src/ bench/
      - run: bun run build
      - run: node dist/jgrep.js --help
      - name: Validate agent skill
        run: npx -y skills-ref@0.1.5 validate skills/jgrep
      - name: Node runtime smoke (the npm package runs under node, tests run under bun)
        env: { TYPESAFE_API_KEY: dummy-key-for-ci }
        run: |
          set +e
          out=$(node dist/jgrep.js --rows examples/creators.csv --json "is this about beauty" 2>&1); code=$?
          set -e
          echo "$out" | tail -3
          # a bad key must surface as an API auth error, never as a runtime error such as ERR_OUT_OF_RANGE
          echo "$out" | grep -qiE "401|invalid_api_key|rejected the key" || { echo "expected an auth error from the API under node"; exit 1; }
          echo "$out" | grep -qiE "out of range|RangeError|TypeError|ReferenceError" && { echo "node runtime error detected"; exit 1; }
          test "$code" -eq 2
